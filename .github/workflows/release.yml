name: Publish verified release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag: publish a verified complete draft or reverify an immutable release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve verified artifacts for the tagged main revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-(beta|rc)\.\d+)?$' -or $env:RELEASE_TAG -cne "v$version") { throw 'Tag and release version must match.' }
          $commit = (git rev-parse HEAD).Trim()
          ./scripts/check-stable-readiness.ps1 -Version $version -Commit $commit
          git merge-base --is-ancestor $commit origin/main
          if (git status --porcelain --untracked-files=normal) { throw 'Release checkout is dirty.' }
          $runs = @{}
          foreach ($workflow in @('verify.yml', 'codeql.yml')) {
            $matches = @(gh run list --workflow $workflow --event push --branch main --commit $commit --status success --json databaseId,headSha,conclusion | ConvertFrom-Json)
            if ($matches.Count -eq 0) { throw "No successful $workflow main run at $commit. Wait for both checks before pushing a tag." }
            $runs[$workflow] = $matches[0].databaseId
          }
          $blockingAlerts = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main" --jq '.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high" or .rule.severity == "error") | .number')
          if ($blockingAlerts.Count) { throw "Unresolved serious code-scanning findings on main: $($blockingAlerts -join ', ')" }
          gh run download $runs['verify.yml'] --name "AppSwitcher-$commit" --dir artifacts/release-upload
          ./scripts/check-release-artifacts.ps1 -Path artifacts/release-upload -Version $version -Commit $commit
          if ($version -notmatch '-') {
            foreach ($installer in Get-ChildItem artifacts/release-upload -Filter '*-setup.exe') {
              if ((Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status -ne 'Valid') { throw 'Stable installer lacks a valid Windows publisher signature.' }
            }
          }
          foreach ($asset in Get-ChildItem artifacts/release-upload -File) {
            gh attestation verify $asset.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/verify.yml" --source-ref refs/heads/main --source-digest $commit --deny-self-hosted-runners
          }
          $stem = "AppSwitcher-$version-win-x64-$($commit.Substring(0, 8))"
          foreach ($file in @("$stem.zip", "$stem-setup.exe")) {
            gh attestation verify "artifacts/release-upload/$file" --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/verify.yml" --source-ref refs/heads/main --source-digest $commit --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($version) + ' [^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)')
          if (-not $section.Success) { throw 'Versioned release notes missing.' }
          $notes = $section.Groups['notes'].Value.Trim() + "`n`nSource: $commit`nWindows verification: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$($runs['verify.yml'])`nCodeQL: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$($runs['codeql.yml'])"
          $notes | Set-Content artifacts/release-notes.md
      - name: Publish or verify immutable versioned assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RESUME_DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # On recovery the source checkout is the old immutable tag. Use the
          # helper from this workflow's trusted revision, not from that old tag.
          if ($env:WORKFLOW_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid workflow revision.' }
          git show "${env:WORKFLOW_SHA}:scripts/publish-verified-release.ps1" |
            Set-Content artifacts/publish-verified-release.ps1
          & ./artifacts/publish-verified-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Path artifacts/release-upload -NotesPath artifacts/release-notes.md -Resume:($env:RESUME_DRAFT -eq 'true')
