name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify application and browser integration
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Build complete offline package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/build-release.ps1
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./scripts/check-release-artifacts.ps1 -Path artifacts/releases -Version $version -Commit (git rev-parse HEAD).Trim()
      - name: Attest the verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/releases/*
          create-storage-record: false
      - name: Locate desktop inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: inventory
        shell: pwsh
        run: |
          $sbom = @(Get-ChildItem artifacts/releases/*.spdx.json)
          if ($sbom.Count -ne 1) { throw 'Expected one desktop SBOM.' }
          "path=$($sbom[0].FullName)" >> $env:GITHUB_OUTPUT
          "stem=$($sbom[0].FullName -replace '\.spdx\.json$', '')" >> $env:GITHUB_OUTPUT
      - name: Attest the desktop dependency inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.inventory.outputs.stem }}.zip
            ${{ steps.inventory.outputs.stem }}-setup.exe
          sbom-path: ${{ steps.inventory.outputs.path }}
          create-storage-record: false
      - name: Retain test reports and native captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: |
            artifacts/test-results
            artifacts/ui-checks
            artifacts/process-performance.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain distributable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppSwitcher-${{ github.sha }}
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 30
