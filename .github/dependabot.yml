version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /AppSwitcher.Tests
      - /AppSwitcher.UiChecks
      - /AppSwitcher.BrowserHost
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
